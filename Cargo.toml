[workspace]
resolver = "3"
members = ["crates/foxmorrow-core", "crates/foxmorrow-devin", "crates/foxmorrow"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
foxmorrow-core = { path = "crates/foxmorrow-core" }
foxmorrow-devin = { path = "crates/foxmorrow-devin" }
